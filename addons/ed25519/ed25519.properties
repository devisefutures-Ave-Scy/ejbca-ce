# HSM Ed25519 add-on - EJBCA build plugin declaration
# Installed as ${EJBCA_HOME}/conf/plugins/ed25519.properties
# @EJBCA_HOME@ is replaced with the real EJBCA home by install-ed25519.sh
# (manual install: replace it yourself, e.g. with sed).
plugin.ejbca.ant.file=@EJBCA_HOME@/addons/ed25519/plugin-build.xml
plugin.ejbca.ant.target=build
